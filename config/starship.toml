"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 500
palette = 'claude'

format = """
$directory$git_branch$git_status$cmd_duration
$character"""

right_format = ""

[palettes.claude]
muted = '#8a8a8a'
dim = '#666666'
accent = '#d97757'
red = '#b36a6a'
green = '#7d9a72'
yellow = '#b09a6a'
blue = '#7289a8'

[directory]
style = 'fg:muted'
format = '[$path]($style)'
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
home_symbol = '~'
read_only = ' ro'
read_only_style = 'fg:red'

[git_branch]
style = 'fg:dim'
format = '[ $branch]($style)'
symbol = ''

[git_status]
style = 'fg:yellow'
format = '[ $all_status$ahead_behind]($style)'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕'
untracked = '?${count}'
stashed = '*${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[cmd_duration]
min_time = 4000
style = 'fg:dim'
format = '[ ${duration}]($style)'

[character]
success_symbol = '[❯](bold fg:accent)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:accent)'

[nodejs]
symbol = ''
style = 'fg:green'
format = '[ node $version]($style)'

[python]
symbol = ''
style = 'fg:blue'
format = '[ py $version]($style)'

[rust]
symbol = ''
style = 'fg:red'
format = '[ rs $version]($style)'

[golang]
symbol = ''
style = 'fg:blue'
format = '[ go $version]($style)'

[lua]
symbol = ''
style = 'fg:blue'
format = '[ lua $version]($style)'

[package]
disabled = true
[docker_context]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[kubernetes]
disabled = true
[time]
disabled = true
[battery]
disabled = true
[memory_usage]
disabled = true
[hostname]
ssh_only = true
style = 'fg:dim'
format = '[$hostname]($style) '
[username]
show_always = false
style_root = 'fg:red'
style_user = 'fg:dim'
