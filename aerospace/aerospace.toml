config-version = 2

# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
  # Window borders (JankyBorders) live with the window manager session.
  'exec-and-forget /bin/bash -c "pkill -x borders; exec $HOME/.config/borders/bordersrc"',
  'exec-and-forget /bin/bash -c "/opt/homebrew/bin/sketchybar --trigger aerospace_refresh"',
]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_refresh FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

on-focus-changed = [
  'exec-and-forget /bin/bash -c "/opt/homebrew/bin/sketchybar --trigger aerospace_refresh FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE"',
  # Ghostty focused -> keyboard switches to English (see ghostty-en.sh)
  'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/ghostty-en.sh"',
]

start-at-login = true

default-root-container-orientation = 'vertical'

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 8

# Possible values: tiles|accordion
default-root-container-layout = 'accordion'

# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# See: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = [
  "main",
  "sec",
  "brwse",
  "note",
  "ai",
  "chat",
  "vpn",
  "Cal&Rem",
  "term",
  # second-monitor workspaces (see [workspace-to-monitor-force-assignment])
  "1",
  "2",
  "3",
  "4",
  "5",
]

# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = [
  'exec-and-forget /bin/bash -c "/opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=$AEROSPACE_MODE"',
]

# See: https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 10
inner.vertical = 10
# The top bar (SketchyBar, 33pt) is drawn on every display, where the macOS menu
# bar would be. The MacBook screen already keeps that strip free (the notch area),
# every other monitor needs the bar height + the usual gap.
outer.top = [{ monitor."built-in" = 10 }, 43]
outer.left = 10
outer.right = 10
outer.bottom = 10

# Workspaces 1-5 live on the second monitor (any display that is not the main one).
# With a single screen they simply open on that screen.
[workspace-to-monitor-force-assignment]
1 = 'secondary'
2 = 'secondary'
3 = 'secondary'
4 = 'secondary'
5 = 'secondary'

# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.main.binding]


# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut
# (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left --wrap-around'
alt-j = 'focus down --wrap-around'
alt-k = 'focus up --wrap-around'
alt-l = 'focus right --wrap-around'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-m = 'workspace main'
alt-s = 'workspace sec'
alt-i = 'workspace ai'
alt-o = 'workspace brwse'
alt-n = 'workspace note'
alt-t = 'workspace chat'
alt-v = 'workspace vpn'
alt-r = 'workspace "Cal&Rem"'
alt-g = 'workspace term'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-m = 'move-node-to-workspace main'
alt-shift-s = 'move-node-to-workspace sec'
alt-shift-i = 'move-node-to-workspace ai'
alt-shift-o = 'move-node-to-workspace brwse'
alt-shift-n = 'move-node-to-workspace note'
alt-shift-t = 'move-node-to-workspace chat'
alt-shift-v = 'move-node-to-workspace vpn'
alt-shift-r = 'move-node-to-workspace "Cal&Rem"'
alt-shift-g = 'move-node-to-workspace term'

# Second monitor: Option+1..5 go to workspace 1..5,
# Shift+Option+1..5 send the focused window there (same scheme as the letters above).
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# window rules
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace note']

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['move-node-to-workspace chat']

[[on-window-detected]]
if.app-id = 'com.google.GeminiMacOS'
run = ['move-node-to-workspace ai']

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = ['move-node-to-workspace ai']

[[on-window-detected]]
if.app-id = 'su.ffg.happ'
run = ['move-node-to-workspace vpn']

[[on-window-detected]]
if.app-id = 'llc.itdev.incy'
run = ['move-node-to-workspace vpn']

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace sec']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace brwse']

[[on-window-detected]]
if.app-id = 'net.imput.helium'
run = ['move-node-to-workspace brwse']

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['move-node-to-workspace brwse']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace term']

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = ['move-node-to-workspace main']

[[on-window-detected]]
if.app-id = 'com.adibhanna.zennotes'
run = ['move-node-to-workspace note']

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['move-node-to-workspace chat']

[[on-window-detected]]
if.app-id = 'chat.rocket'
run = ['move-node-to-workspace chat']

[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = ['move-node-to-workspace chat']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating']
