# astronaut — tmux theme in the same palette as Ghostty and Neovim
# (colours from the wallpaper + the aqua-blue window glow).
# Sourced from tmux.conf. Pill caps   are Nerd Font glyphs; Ghostty
# draws them from its built-in symbols.
#
#  [ session ] 1 nvim  2 git              [PREFIX] [  folder ] [  branch ]

set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default fg=#8f857a"
set -g status-left-length 40
set -g status-right-length 120

# left: session name in the main accent (blue = window glow)
set -g status-left "#[fg=#7daea3 bg=default]#[fg=#1c1513 bg=#7daea3 bold] #S #[fg=#7daea3 bg=default nobold] "

# windows: inactive = grey text, current = dark pill with orange number
set -g window-status-separator " "
set -g window-status-format "#[fg=#6b5a50]#I #[fg=#8f857a]#W"
set -g window-status-current-format "#[fg=#3b2c26 bg=default]#[fg=#ef8f4c bg=#3b2c26 bold]#I #[fg=#e3dccb]#W#{?window_zoomed_flag, 󰊓,}#[fg=#3b2c26 bg=default nobold]"

# right: mode (PREFIX / COPY), current folder, git branch of that folder
set -g status-right "\
#{?client_prefix,#[fg=#ef8f4c bg=default]#[fg=#1c1513 bg=#ef8f4c bold] PREFIX #[fg=#ef8f4c bg=default nobold] ,}\
#{?pane_in_mode,#[fg=#e5c15a bg=default]#[fg=#1c1513 bg=#e5c15a bold] COPY #[fg=#e5c15a bg=default nobold] ,}\
#[fg=#2a1f1b bg=default]#[fg=#e3dccb bg=#2a1f1b] #[fg=#8aa1b8] #[fg=#e3dccb]#{b:pane_current_path} #[fg=#2a1f1b bg=default nobold]\
#(~/.config/tmux/git-branch.sh '#{pane_current_path}')"

# panes: active border = window-glow blue
set -g pane-border-lines single
set -g pane-border-style "fg=#3b2c26"
set -g pane-active-border-style "fg=#7daea3"

# messages, command prompt, copy-mode selection, clock
set -g message-style "bg=#2a1f1b fg=#e3dccb"
set -g message-command-style "bg=#2a1f1b fg=#ef8f4c"
set -g mode-style "bg=#3b2c26 fg=#e3dccb"
setw -g clock-mode-colour "#7daea3"

# terminal title: host:window
set -g set-titles on
set -g set-titles-string '#h:#W'
