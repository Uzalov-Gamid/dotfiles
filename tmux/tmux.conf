# Status bar

set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{pane_current_command}'
set -g set-titles on
set -g set-titles-string '#h:#W'

set -g status-justify right

# Theme  = Gruvbox
set -g status-style "bg=default,fg=#a89984"
set -g status-left "#[fg=#E6D8AF,bg=#4F4845] #S "
set -g status-right "#[fg=#a89984]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}"
set -g window-status-format "#[fg=#a89984] #{?client_prefix,#I:,}#W "
set -g window-status-current-format "#[fg=#ebdbb2,bold] #{?client_prefix,#I:,}#W "
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#e5784c"
set -g message-style "bg=#514946,fg=#a89984"
set -g message-command-style "bg=#514946,fg=#a89984"
set -g mode-style "bg=#a89984,fg=#282828"
setw -g clock-mode-colour "#a89984"

