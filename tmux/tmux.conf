set -g default-terminal "xterm-256color"

set -as terminal-overrides ",xterm-ghostty:RGB"
set -ga terminal-overrides ',*256col*:Tc'
set -g base-index 1
set -g detach-on-destroy off

setw -g mode-keys vi
set -g renumber-windows on
set -s escape-time 0
set -g set-clipboard on
# let programs show images (kitty graphics, e.g. the KeepHeat calendar)
set -g allow-passthrough on

set -gw automatic-rename on
set -gw automatic-rename-format '#{pane_current_command}'

# Look: status bar on top with widgets, colours = astronaut palette
source-file ~/.config/tmux/theme.conf


set -g @floax-bind 'b'

bind -r C-Left  resize-pane -L 10
bind -r C-Down  resize-pane -D 10
bind -r C-Up    resize-pane -U 10
bind -r C-Right resize-pane -R 10
# same with vim keys, finer steps: prefix then Ctrl-h/j/k/l (repeatable)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5
bind r source-file ~/.config/tmux/tmux.conf\; display "Config reloaded!"

bind-key -n C-S-Up swap-window -t -1\; select-window -t -1
bind-key -n C-S-Down swap-window -t +1\; select-window -t +1

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'christoomey/vim-tmux-navigator'


# TPM init
run '~/.tmux/plugins/tpm/tpm'

unbind-key -n C-\\
unbind-key C-\\
