# Minimal tmux config matching the rest of the rig: quiet, monochrome,
# one warm accent color for whatever is "active" or "you".

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# Prefix: Ctrl-a instead of the awkward Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Splits that make sense, keeping the current path.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation and resizing.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style copy mode, with system-clipboard yank.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ---- Theme: same palette as Ghostty / Neovim / Starship. ----
BG="#161616"
FG="#d7d7d7"
DIM="#666666"
MUTED="#8a8a8a"
ACCENT="#d97757"

set -g status-position bottom
set -g status-style "bg=${BG},fg=${DIM}"
set -g status-interval 5
set -g status-left-length 20
set -g status-right-length 60

set -g status-left "#[fg=${ACCENT},bold] ❯ #S #[fg=${DIM}]"
set -g status-right "#[fg=${DIM}]%H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=${ACCENT},bold] #I:#W "
setw -g window-status-separator ""

set -g pane-border-style "fg=${DIM}"
set -g pane-active-border-style "fg=${ACCENT}"

set -g message-style "bg=${BG},fg=${ACCENT}"
set -g mode-style "bg=${ACCENT},fg=${BG}"

setw -g monitor-activity on
set -g visual-activity off

# ---- Plugins (via TPM) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
