"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 200

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$golang\
$lua\
$sql\
$c\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[>](purple)"
error_symbol = "[>](red)"
vimcmd_symbol = "[<](green)"

[git_branch]
format = "[$branch]($style)"
style = "bold-green"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
symbol = "py "
style = "bold yellow"
format = "via [${symbol}(${version} )(\\($virtualenv\\) )]($style)"

[golang]
symbol = "go "
style = "bold cyan"

[c]
symbol = "c "
style = "bold blue"
detect_files = ["CMakeLists.txt", "compile_commands.json", ".clang-format", "configure"]
# detect_folders = ["src", "inc", "include"]

[lua]
symbol = "lua "
style = "bold blue"
detect_files = ["init.lua", ".stylua.toml"]
detect_folders = ["lua"]
